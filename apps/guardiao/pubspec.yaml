name: guardiao
description: "Guardião - controle parental para jogos: um app para o responsável e para o filho."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.6
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  guardiao_core:
    path: ../../packages/guardiao_core
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend.ttf
