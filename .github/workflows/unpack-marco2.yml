# Temporário: descompacta o pacote do marco 2 nos lugares certos, apaga os
# apps antigos e remove o pacote. Depois de rodar, este arquivo pode ser apagado.
name: unpack-marco2
on:
  push:
    paths:
      - '.github/workflows/unpack-marco2.yml'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar e organizar
        run: |
          set -euo pipefail
          test -f guardiao-gamer-marco2.zip
          mkdir /tmp/x
          unzip -q guardiao-gamer-marco2.zip -d /tmp/x
          rm -rf apps/child apps/parent apps/guardiao packages/guardiao_core
          mkdir -p apps packages firebase docs
          cp /tmp/x/README.md apps/README.md
          cp -r /tmp/x/apps/guardiao apps/guardiao
          cp -r /tmp/x/packages/guardiao_core packages/guardiao_core
          cp -r /tmp/x/firebase/. firebase/
          cp /tmp/x/docs/ARQUITETURA.md /tmp/x/docs/CONFIGURAR-FIREBASE.md docs/
          rm guardiao-gamer-marco2.zip
          echo "arquivos em apps/guardiao: $(find apps/guardiao -type f | wc -l)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github/workflows/unpack-marco2.yml'
          git commit -m "App unico Guardiao Gamer (marco 2): Bluetooth, medicao de uso e bloqueio; remove apps/child e apps/parent"
          git push
