name: Desempacotar
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar o pacote
        run: |
          unzip -o code-update.zip
          rm code-update.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Atualização dentro do app, ícones reais dos apps e documentação"
          git push
