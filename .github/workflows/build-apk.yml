name: Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Conferir os segredos
        env:
          K1: ${{ secrets.FIREBASE_API_KEY }}
          K2: ${{ secrets.FIREBASE_APP_ID }}
          K3: ${{ secrets.FIREBASE_PROJECT_ID }}
          K4: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          K5: ${{ secrets.KEYSTORE_BASE64 }}
          K6: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          for v in K1 K2 K3 K4 K5 K6; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta cadastrar os 6 segredos (4 do Firebase + KEYSTORE_BASE64 e KEYSTORE_PASSWORD) em Settings > Secrets and variables > Actions (veja docs/CONFIGURAR-FIREBASE.md, passo 5)."
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/guardiao.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/guardiao.jks" >> "$GITHUB_ENV"

      - name: Compilar
        working-directory: apps/guardiao
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/guardiao.apk"

      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" guardiao.apk \
            --title "Guardião (APK #${{ github.run_number }})" \
            --notes "APK para Android compilado de ${GITHUB_SHA::7}. Quem já tem o app instalado recebe o aviso de atualização dentro do próprio app." \
            --latest
