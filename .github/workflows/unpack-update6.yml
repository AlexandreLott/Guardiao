# Temporário: aplica o pacote code-update6.zip e se apaga em seguida.
name: unpack-update6
on:
  push:
    paths:
      - '.github/workflows/unpack-update6.yml'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar pacote
        run: |
          set -euo pipefail
          test -f code-update6.zip
          unzip -q -o code-update6.zip
          rm code-update6.zip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached .github/workflows/unpack-update6.yml || true
          git add -A -- . ':!.github/workflows/unpack-update6.yml'
          git commit -m "Corrige botao Atualizar escondido pelo tema" || echo "nada a commitar"
          git push
