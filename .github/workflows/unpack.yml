name: unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          rm -rf apps/guardiao packages/guardiao_core firebase
          unzip -o guardiao-src.zip
          rm -f guardiao-src.zip
          find apps packages firebase docs -type f | wc -l
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "App: vinculo por QR gerado pelo filho, varios aparelhos, sem Bluetooth"
          git push
