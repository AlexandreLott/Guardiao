name: Compilar APKs de teste (Mãe e Filho)

# Dois APKs com pacotes diferentes, para instalar os dois no mesmo celular e
# testar o bloqueio de verdade: "Guardian Mãe" (responsável) e "Guardian
# Filho" (criança). Usam o mesmo Firebase do app oficial. Ficam como
# artefatos desta execução; não viram Release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apks:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/guardiao.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/guardiao.jks" >> "$GITHUB_ENV"

      - name: Compilar Mãe e Filho
        working-directory: apps/guardiao
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          flutter pub get
          build() {
            APP_ID_SUFFIX="$1" APP_LABEL="$2" flutter build apk --release \
              --target-platform android-arm64 \
              --build-number=${{ github.run_number }} \
              --build-name=1.0.${{ github.run_number }}-teste \
              --dart-define=ROLE=$3 \
              --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
              --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
              --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
              --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
            cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/$4"
          }
          build .mae "Guardian Mãe" parent guardian-mae.apk
          build .filho "Guardian Filho" child guardian-filho.apk

      - uses: actions/upload-artifact@v4
        with:
          name: guardian-mae-e-filho
          path: |
            guardian-mae.apk
            guardian-filho.apk
          retention-days: 14
